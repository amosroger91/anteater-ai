<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anteater scanner</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f3efe6; color: #1d1a16; }
    header { background: #1d1a16; color: #f3efe6; padding: 28px 20px 22px; }
    header h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; max-width: 44rem; line-height: 1.45; }
    main { max-width: 48rem; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
    section, .host { background: #fff; border: 1px solid #1d1a16; padding: 20px; }
    .host + .host { margin-top: 12px; }
    h2 { margin: 0 0 8px; font-size: 22px; }
    h3 { margin: 0; font-size: 18px; }
    p, li { line-height: 1.45; }
    .help { color: #3d3832; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    button, a.button { min-height: 44px; padding: 10px 16px; font: inherit; cursor: pointer; border: 1px solid #1d1a16; background: #1d1a16; color: #f3efe6; text-decoration: none; display: inline-flex; align-items: center; }
    button.secondary { background: #fff; color: #1d1a16; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .error { background: #fff4f0; border: 1px solid #8a2b12; color: #6d1f0c; padding: 10px 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #1d1a16; vertical-align: top; }
    footer { max-width: 48rem; margin: 0 auto; padding: 0 20px 28px; }
    footer a { color: #1d1a16; }
  </style>
</head>
<body>
  <header>
    <h1>Anteater scanner</h1>
    <p>Choose a hostname you saved. Scan sends four read-only HTTPS requests to that host: the home page, robots.txt, sitemap.xml, and the OpenAPI document.</p>
  </header>
  <main>
    <div id="error" class="error" hidden></div>
    <section>
      <h2>Saved hosts</h2>
      <p id="private" class="help"></p>
      <div id="hosts"></div>
    </section>
    <section>
      <h2>Fixture scan</h2>
      <p class="help">Practice run on local data. It does not contact a host.</p>
      <button class="secondary" id="fixture" type="button">Run the fixture scan</button>
      <div id="fixture-result"></div>
    </section>
  </main>
  <footer><a href="/">Back to setup</a></footer>
  <script>
    const errorBox = document.querySelector('#error');
    const hosts = document.querySelector('#hosts');
    function showError(message) {
      errorBox.hidden = !message;
      errorBox.textContent = message || '';
    }
    function messageFor(code) {
      const messages = {
        host_not_saved: 'That hostname is not in the saved lab list.',
        blocked_address: 'The address is blocked. Turn on private lab access in setup if this hostname is yours and it uses a private address.',
        origin_rejected: 'The scan was refused.',
        scan_failed: 'The scan failed.',
        request_timeout: 'The host did not respond in time.',
        etimedout: 'The host did not respond in time.',
        econnrefused: 'The host refused the connection.',
        enotfound: 'The hostname did not resolve.',
        ehostunreach: 'The host could not be reached.',
        enetunreach: 'The network could not reach the host.',
        econnreset: 'The host closed the connection.',
        request_failed: 'The request failed.',
      };
      return messages[code] || code;
    }
    function resultTable(scan) {
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>Path</th><th>Status</th><th>Result</th></tr></thead>';
      const body = document.createElement('tbody');
      for (const check of scan.checks) {
        const row = document.createElement('tr');
        const result = check.error
          ? messageFor(check.error)
          : (check.findings.length ? check.findings.map(finding => finding.code + ' (' + finding.severity + ')').join(', ') : 'No finding');
        for (const value of [check.path, check.status ? String(check.status) : '—', result]) {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.append(cell);
        }
        body.append(row);
      }
      table.append(body);
      return table;
    }
    function renderHosts(status) {
      const names = (status.labHosts || '').split(',').map(host => host.trim()).filter(Boolean);
      document.querySelector('#private').textContent = status.allowPrivateLabTargets
        ? 'Private addresses are allowed for these hostnames.'
        : 'Private addresses stay blocked. A public address is scanned as-is.';
      hosts.replaceChildren();
      if (!names.length) {
        const empty = document.createElement('p');
        empty.textContent = 'No lab hostname is saved.';
        const link = document.createElement('a');
        link.className = 'button';
        link.href = '/';
        link.textContent = 'Add one in setup';
        hosts.append(empty, link);
        return;
      }
      for (const name of names) {
        const card = document.createElement('div');
        card.className = 'host';
        const row = document.createElement('div');
        row.className = 'row';
        const title = document.createElement('h3');
        title.textContent = name;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Scan';
        const output = document.createElement('div');
        button.addEventListener('click', () => scanHost(name, button, output));
        row.append(title, button);
        card.append(row, output);
        hosts.append(card);
      }
    }
    async function scanHost(host, button, output) {
      showError('');
      button.disabled = true;
      output.replaceChildren();
      const note = document.createElement('p');
      note.textContent = 'Scanning https://' + host + '/';
      output.append(note);
      try {
        const response = await fetch('/api/scan/lab', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ host }),
        });
        const body = await response.json();
        if (!response.ok) { showError(messageFor(body.error || 'scan_failed')); note.textContent = 'Scan stopped.'; return; }
        const firstError = body.checks.map(check => check.error).find(Boolean);
        note.textContent = body.contactedNetwork
          ? 'Scan finished. Requests were sent to ' + body.host + '.'
          : (firstError && firstError !== 'blocked_address'
            ? 'Scan finished. ' + body.host + ' did not answer, so the other paths were not requested. ' + messageFor(firstError)
            : 'Scan finished. No request was sent.');
        output.append(resultTable(body));
      } catch {
        showError('The scan failed.');
        note.textContent = 'Scan stopped.';
      } finally {
        button.disabled = false;
      }
    }
    async function runFixture() {
      const button = document.querySelector('#fixture');
      const output = document.querySelector('#fixture-result');
      button.disabled = true;
      output.textContent = 'Running the fixture scan.';
      try {
        const response = await fetch('/api/scan/fixture', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
        const body = await response.json();
        if (!response.ok) { output.textContent = 'The fixture scan failed.'; return; }
        const admitted = (body.admitted || []).join(', ') || 'none';
        const finding = body.findings?.[0];
        output.textContent = 'Fixture finished. Admitted: ' + admitted + '. ' + (finding ? finding.code : 'No finding') + '. No network request.';
      } catch {
        output.textContent = 'The fixture scan failed.';
      } finally {
        button.disabled = false;
      }
    }
    document.querySelector('#fixture').addEventListener('click', runFixture);
    fetch('/api/status').then(response => response.json()).then(renderHosts).catch(() => showError('Saved setup could not be read.'));
  </script>
</body>
</html>
