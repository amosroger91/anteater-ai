name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anteater
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: anteater
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U anteater -d anteater"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deps:check
      - run: npm run test:integration
      - run: npm run demo
        env:
          GLOBAL_KILL_SWITCH: "false"
